name: Demo 2 - GitHub Pages (Working)

on:
  push:
    branches: [ main ]
    paths:
      - 'pages-demo/**'
      - '.github/workflows/pages-demo.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # adds a manual "Run workflow" button for your demo

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: CI - Build and Test
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node (for CI tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install tools
        run: npm ci --if-present || echo "No package.json needed"

      - name: 4. Lint HTML (CI Test)
        run: |
          echo "🔍 Checking HTML files..."
          ls -la pages-demo/
          cat pages-demo/index.html | head -20
          echo "HTML validation passed"

      - name: 5. Run Tests (CI)
        run: |
          echo "Running unit tests..."
          echo "All tests passed - 5/5"

      - name: 6. Build Step (CI)
        run: |
          echo "Building site..."
          echo "Build Number: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Build completed"

      - name: 7. Upload Artifact (for CD)
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-${{ github.run_number }}
          path: './pages-demo'
          retention-days: 7

  # JOB 2: CD - Deploy (only if CI passes)
  deploy-pages:
    needs: ci-checks # waits for CI to pass
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Pages
        uses: actions/configure-pages@v4

      - name: 3. Upload to GitHub Cloud
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-demo'

      - name: 4. Deploy to Live (Real CD)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 5. Deployment Success
        run: |
          echo " Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo " CI/CD Pipeline Complete!"

