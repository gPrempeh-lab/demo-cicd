name: Demo 3 - 3 Stages CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'demo3-tests/**'
      - '.github/workflows/demo3-tests.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # STAGE 1: BUILD
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v5

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo3-tests/package.json

      - name: 3. Install Dependencies
        working-directory: ./demo3-tests
        run: npm ci

      - name: 4. Build App
        working-directory: ./demo3-tests
        run: |
          echo "Building..."
          mkdir -p dist
          cp index.html dist/
          cp app.js dist/
          echo "Build #${{ github.run_number }} - Commit ${{ github.sha }}"
          echo "Build completed"

      - name: 5. Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: demo3-tests/dist
          retention-days: 1

  # STAGE 2: TEST
  test-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v5

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo3-tests/package.json

      - name: 3. Install Dependencies
        working-directory: ./demo3-tests
        run: npm ci

      - name: 4. Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: demo3-tests/dist

      - name: 5. Run Unit Tests
        working-directory: ./demo3-tests
        run: npm test -- --verbose

      - name: 6. Run Coverage
        working-directory: ./demo3-tests
        run: npm run test:coverage

  # STAGE 3: DEPLOY
  deploy-job:
    needs: test-job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v5

      - name: 2. Setup Pages
        uses: actions/configure-pages@v5

      - name: 3. Upload to Cloud
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demo3-tests'

      - name: 4. Deploy to Live
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 5. Success
        run: echo " Live at ${{ steps.deployment.outputs.page_url }}"

